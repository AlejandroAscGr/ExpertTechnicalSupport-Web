    <main class="container py-4">
        <div class="row g-4">
            
            <!-- PANEL DE FILTROS -->
            <div class="col-lg-4">
                <div class="glass-card rounded-4 p-4 shadow-sm h-100">
                    <h5 class="fw-bold text-success mb-4"><i class="bi bi-funnel me-2"></i>Filtros</h5>
                    
                    <h6 class="small fw-bold text-secondary fst-italic mb-2">Por Fecha:</h6>
                    <div class="mb-2">
                        <label class="small text-secondary">Desde</label>
                        <input type="date" id="filtroDesde" class="form-control glass-input form-control-sm">
                    </div>
                    <div class="mb-4">
                        <label class="small text-secondary">Hasta</label>
                        <input type="date" id="filtroHasta" class="form-control glass-input form-control-sm">
                    </div>

                    <h6 class="small fw-bold text-secondary fst-italic mb-2">Tipo de servicio:</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input filtro-modalidad" type="checkbox" value="Presencial" id="chkPresencial">
                        <label class="form-check-label text-secondary" for="chkPresencial">Presencial</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input filtro-modalidad" type="checkbox" value="Remoto" id="chkRemoto">
                        <label class="form-check-label text-secondary" for="chkRemoto">Remoto</label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input filtro-modalidad" type="checkbox" value="Asesoria" id="chkAsesoria">
                        <label class="form-check-label text-secondary" for="chkAsesoria">Asesoría</label>
                    </div>

                    <h6 class="small fw-bold text-secondary fst-italic mb-2">Estatus del ticket:</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input filtro-estatus" type="checkbox" value="Asignado" id="chkAsignado">
                        <label class="form-check-label text-secondary" for="chkAsignado">Asignados (Pendientes)</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input filtro-estatus" type="checkbox" value="Proceso" id="chkProceso">
                        <label class="form-check-label text-secondary" for="chkProceso">En Proceso</label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input filtro-estatus" type="checkbox" value="Cerrado" id="chkCerrado">
                        <label class="form-check-label text-secondary" for="chkCerrado">Cerrados</label>
                    </div>

                    <hr class="text-secondary opacity-25">
                    <h6 class="small fw-bold text-secondary fst-italic mb-2">Ordenar por:</h6>
                    <select id="selectOrden" class="form-select glass-input text-secondary mb-3">
                        <option value="reciente">Más reciente primero</option>
                        <option value="antiguo">Más antiguo primero</option>
                    </select>

                    <button class="btn btn-outline-secondary w-100" id="btnLimpiarFiltrosTC"><i class="bi bi-eraser me-1"></i> Limpiar Filtros</button>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="glass-card rounded-4 p-4 shadow-sm h-100">
                    <h5 class="fw-bold text-success mb-4">Lista de Tareas</h5>
                    <div id="listaTickets" class="d-grid gap-3">
                        <div class="text-center py-5 text-secondary">Cargando tickets...</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- DETALLE DE TICKET -->
    <div class="modal fade" id="modalAtenderTicket" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content client-modal border-0 rounded-4 shadow">
                <div class="modal-header border-0 bg-success bg-opacity-10 rounded-top-4">
                    <h5 class="modal-title fw-bold text-success" id="modalTituloTicket">Atender Ticket</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="small text-secondary mb-1">Concepto a resolver:</p>
                    <h6 class="fw-bold mb-4 text-dark" id="modalConcepto"></h6>
                    
                    <form id="formActualizarTicket">
                        <input type="hidden" id="modalIdTicket">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Actualizar Estatus</label>
                            <select id="modalStatus" class="form-select glass-input">
                                <option value="Asignado">Asignado</option>
                                <option value="Proceso">En Proceso</option>
                                <option value="Cerrado">Cerrado (Resuelto)</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Notas del Técnico</label>
                            <textarea id="modalNotas" class="form-control glass-input" rows="4" placeholder="Detalla la solución, los avances o el material utilizado..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 rounded-pill py-2"><i class="bi bi-save me-1"></i> Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
