<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reporte - Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-bg client-area">

    <header class="glass-header sticky-top shadow-sm">
        <nav class="container navbar py-3 d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <img src="../img/logoETS75px.png" alt="Logo ETS" class="client-logo me-3">
                <div>
                    <h5 class="fw-bold mb-0 text-success">Mi Reporte</h5>
                    <small class="text-secondary">Técnico: <span id="nombreTecnicoHeader">Cargando...</span></small>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4" style="max-width: 800px;">
        <h4 class="text-center fw-bold text-success mb-4" id="mesReporte">Reporte: ...</h4>

        <div class="row g-3 mb-4 text-center">
            <div class="col-6">
                <div class="glass-card rounded-4 p-3 shadow-sm h-100">
                    <div class="small fw-bold text-secondary mb-1">Total del mes</div>
                    <h2 class="fw-bold text-success mb-0" id="repTotal">0</h2>
                </div>
            </div>
            <div class="col-6">
                <div class="glass-card rounded-4 p-3 shadow-sm h-100">
                    <div class="small fw-bold text-secondary mb-1">Tickets cerrados</div>
                    <h2 class="fw-bold text-success mb-0" id="repCerrados">0</h2>
                </div>
            </div>
            <div class="col-6">
                <div class="glass-card rounded-4 p-3 shadow-sm h-100">
                    <div class="small fw-bold text-secondary mb-1">En proceso</div>
                    <h2 class="fw-bold text-warning mb-0" id="repProceso">0</h2>
                </div>
            </div>
            <div class="col-6">
                <div class="glass-card rounded-4 p-3 shadow-sm h-100">
                    <div class="small fw-bold text-secondary mb-1">Asignados</div>
                    <h2 class="fw-bold text-danger mb-0" id="repAsignados">0</h2>
                </div>
            </div>
        </div>

        <!-- PROGRESO -->
        <div class="glass-card rounded-4 p-4 shadow-sm mb-4">
            <h6 class="fw-bold text-success mb-3">Progreso del mes</h6>
            <div class="progress" style="height: 20px; border-radius: 10px;">
                <div id="barraProgreso" class="progress-bar bg-success" role="progressbar" style="width: 0%;"></div>
            </div>
            <div class="text-center small fw-bold text-success mt-2"><span id="txtProgreso">0</span>% completado</div>
        </div>

        <!-- HISTORIAL -->
        <div class="glass-card rounded-4 p-4 shadow-sm mb-4">
            <h6 class="fw-bold text-success mb-3">Historial del mes</h6>
            <div class="table-responsive">
                <table class="table table-borderless align-middle small">
                    <thead class="text-success fw-bold border-bottom">
                        <tr>
                            <th>#</th>
                            <th>Concepto</th>
                            <th>Estatus</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorial">
                        <tr><td colspan="4" class="text-center py-3 text-secondary">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-end">
            <a href="indextc.html" class="btn btn-secondary rounded-pill px-4"><i class="bi bi-arrow-left-circle me-1"></i> Regresar</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/tc.js"></script>
</body>
</html>
