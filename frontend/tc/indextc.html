<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tickets - Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-bg client-area">

    <header class="glass-header sticky-top shadow-sm">
        <nav class="container navbar py-3 d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <img src="../img/logoETS75px.png" alt="Logo ETS" class="client-logo me-3">
                <div>
                    <h5 class="fw-bold mb-0 text-success">Mis tickets</h5>
                    <small class="text-secondary">Técnico: <span id="nombreTecnicoHeader">Cargando...</span></small>
                </div>
            </div>
            <div>
                <a href="reporte_tc.html" class="btn btn-success rounded-pill me-2"><i class="bi bi-bar-chart-fill me-1"></i> Mi reporte mensual</a>
                <a href="../../backend_general/cerrar_sesion.php" class="btn btn-outline-secondary rounded-pill"><i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión</a>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <div class="row g-4">
            
            <!-- FILTROS -->
            <div class="col-lg-4">
                <div class="glass-card rounded-4 p-4 shadow-sm h-100">
                    <h5 class="fw-bold text-success mb-4">Filtros</h5>
                    
                    <h6 class="small fw-bold text-secondary fst-italic mb-2">Tipo de servicio:</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input filtro-modalidad" type="checkbox" value="Presencial" id="chkPresencial">
                        <label class="form-check-label text-secondary" for="chkPresencial">Presencial</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input filtro-modalidad" type="checkbox" value="Remoto" id="chkRemoto">
                        <label class="form-check-label text-secondary" for="chkRemoto">Remoto</label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input filtro-modalidad" type="checkbox" value="Asesoria" id="chkAsesoria">
                        <label class="form-check-label text-secondary" for="chkAsesoria">Asesoría</label>
                    </div>

                    <h6 class="small fw-bold text-secondary fst-italic mb-2">Estatus del ticket</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input filtro-estatus" type="checkbox" value="Asignado" id="chkAsignado">
                        <label class="form-check-label text-secondary" for="chkAsignado">Asignados</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input filtro-estatus" type="checkbox" value="Proceso" id="chkProceso">
                        <label class="form-check-label text-secondary" for="chkProceso">En Proceso</label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input filtro-estatus" type="checkbox" value="Cerrado" id="chkCerrado">
                        <label class="form-check-label text-secondary" for="chkCerrado">Cerrados</label>
                    </div>

                    <hr class="text-secondary opacity-25">

                    <h6 class="small fw-bold text-secondary fst-italic mb-2">Ordenar por:</h6>
                    <select id="selectOrden" class="form-select glass-input text-secondary">
                        <option value="reciente">Más reciente primero</option>
                        <option value="antiguo">Más antiguo primero</option>
                    </select>
                </div>
            </div>

            <!-- LISTA DE TICKETS -->
            <div class="col-lg-8">
                <div class="glass-card rounded-4 p-4 shadow-sm h-100">
                    <h5 class="fw-bold text-success mb-4">Tickets</h5>
                    <div id="listaTickets" class="d-grid gap-3">
                    
                        <div class="text-center py-5 text-secondary">Cargando tickets...</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- DETALLE TICKET -->
    <div class="modal fade" id="modalAtenderTicket" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content client-modal">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold text-success" id="modalTituloTicket">Atender Ticket</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-secondary mb-1">Concepto:</p>
                    <h6 class="fw-bold mb-3" id="modalConcepto"></h6>
                    
                    <form id="formActualizarTicket">
                        <input type="hidden" id="modalIdTicket">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Estatus</label>
                            <select id="modalStatus" class="form-select glass-input">
                                <option value="Asignado">Asignado</option>
                                <option value="Proceso">En Proceso</option>
                                <option value="Cerrado">Cerrado</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Notas del Técnico</label>
                            <textarea id="modalNotas" class="form-control glass-input" rows="3" placeholder="Detalla la solución o avances..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 rounded-pill"><i class="bi bi-check-circle me-1"></i> Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/tc.js"></script>
</body>
</html>
