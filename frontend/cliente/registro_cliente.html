<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de cliente - ISANA LABS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="../css/style.css" rel="stylesheet">
</head>

<body class="app-bg">

    <header class="glass-header p-3 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center">
                <img src="../img/logoETS75px.png"
                    alt="Logo ETS"
                    style="height: 45px;"
                    class="me-3">

                <div>
                    <h5 class="fw-bold mb-0">Expert Technical Support</h5>
                    <small class="text-secondary">Registro de cliente</small>
                </div>
            </div>

            <a href="../login.html" class="btn btn-outline-success">
                <i class="bi bi-arrow-left me-1"></i>
                Regresar
            </a>

        </div>
    </header>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <section class="glass-card rounded-4 p-4 p-lg-5 shadow-sm">

                    <div class="text-center mb-4">
                        <span class="badge bg-success bg-opacity-10 text-success mb-3">
                            Nuevo cliente
                        </span>

                        <h1 class="fw-bold">Crea tu cuenta</h1>

                        <p class="text-secondary">
                            Ingresa tus datos.
                        </p>
                    </div>

                    <form action="#" method="POST">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="nombre" class="form-label">
                                    Nombre
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label for="apellido" class="form-label">
                                    Apellido
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="apellido"
                                    name="apellido"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label for="telefono" class="form-label">
                                    Teléfono
                                </label>

                                <input type="tel"
                                    class="form-control"
                                    id="telefono"
                                    name="telefono"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <label for="correo" class="form-label">
                                    Correo electrónico
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    required>
                            </div>

                            <div class="col-12">
                                <label for="empresa" class="form-label">
                                    Empresa
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="empresa"
                                    name="empresa">
                            </div>
                            
                            <div class="col-md-6">
                            <label for="passC" class="form-label">
                                Contraseña
                            </label>

                            <input type="password"
                                class="form-control"
                                id="passC"
                                name="passC"
                                required>
                        </div>


                        </div>

                        <button type="submit"
                            class="btn btn-success w-100 mt-4 py-2 fw-bold login-btn">
                            Registrarse
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <span class="text-secondary">
                            ¿Ya tienes una cuenta?
                        </span>

                        <a href="../login.html"
                            class="text-success text-decoration-none fw-semibold">
                            Iniciar sesión
                        </a>
                    </div>

                </section>

            </div>

        </div>

    </main>

</body>

</html>
